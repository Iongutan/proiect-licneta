# ═══════════════════════════════════════════════════════════════════
# OptiFleet B2B — servicii locale de suport
#
#   osrm        rutare pe drumurile Moldovei (date: ./osrm/setup.sh)
#   ml_service  DBSCAN, CVRP, intenție Qwen3 — intern, cu token
#
# Baza de date, autentificarea, fișierele și timpul real sunt în Supabase
# (cloud). Frontend-ul Next.js rulează separat: `npm run dev`.
#
# Toate porturile sunt legate DOAR de 127.0.0.1 — nimic nu e expus în rețea.
# ═══════════════════════════════════════════════════════════════════

name: optifleet

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:${OSRM_TAG:-latest}
    command: osrm-routed --algorithm mld --max-table-size 500 /data/moldova-latest.osrm
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }

  ml_service:
    build: ./ml_service
    env_file: ./ml_service/.env
    environment:
      OSRM_BASE_URL: http://osrm:5000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - osrm
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2.0" }
