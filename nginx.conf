worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections  65536;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compresie gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Rate limiting global (layer suplimentar față de Rust)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

    # Upstream Rust API (scalabil cu docker-compose --scale api=N)
    upstream optifleet_api {
        least_conn;                          # Load balancing: conexiuni mai puține
        server api:8000 max_fails=3 fail_timeout=30s;
        # docker-compose scale api=4 → Nginx detectează automat noile instanțe
        keepalive 100;                       # Pool de conexiuni persistente
    }

    # Upstream OSRM Cluster (PROMPT J8: Round-robin load balancing pentru scalare calcule rute)
    upstream osrm_cluster {
        least_conn;
        server osrm:5000 max_fails=3 fail_timeout=10s;
        server osrm_replica:5000 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost optifleet.md www.optifleet.md;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Metrics Prometheus (PROMPT J9) ───────────────────────
        location /metrics {
            proxy_pass http://optifleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ─── API REST ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://optifleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # PROMPT J3: SUPRASCRIE (nu adaugă) X-Forwarded-For cu IP-ul real al conexiunii
            # Previne falsificarea de IP de către client pentru ocolirea rate limiter-ului
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── SSE Chat Streaming (timeout mai mare) ────────────────
        location /api/v1/chat/ {
            proxy_pass http://optifleet_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";

            # SSE: fără buffering, timeout lung
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ─── WebSocket GPS Tracking ───────────────────────────────
        location /ws/ {
            limit_req zone=ws burst=5 nodelay;

            proxy_pass http://optifleet_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;

            # WebSocket: timeout lung (conexiune persistentă)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Frontend Next.js ─────────────────────────────────────
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Health check (pentru load balancer extern) ───────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
